<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Home Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    /* Car screen container */
    .screen {
      max-width: 900px;
      margin: 30px auto;
      background: linear-gradient(180deg, #111827, #020617);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      letter-spacing: 1px;
    }

    .time {
      font-size: 18px;
      opacity: 0.8;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .status {
      font-size: 14px;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    /* Toggle button */
    .toggle {
      width: 60px;
      height: 30px;
      background: #1e293b;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
    }

    .toggle::after {
      content: '';
      width: 26px;
      height: 26px;
      background: #64748b;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.3s;
    }

    .toggle.active {
      background: #22c55e;
    }

    .toggle.active::after {
      left: 32px;
      background: #ecfeff;
    }

    /* Parking door */
    .parking {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .parking button {
      background: #2563eb;
      border: none;
      border-radius: 12px;
      color: #fff;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    .parking button.close {
      background: #dc2626;
    }

  </style>
</head>
<body>

  <div class="screen">
    <div class="header">
      <h1>SMART HOME</h1>
      <div class="time" id="time"></div>
    </div>

    <div class="cards">
      <!-- Smart Lamp -->
      <div class="card">
        <h2>💡 Smart Lamp</h2>
        <div class="status" id="lampStatus">OFF</div>
        <div class="toggle" id="lampToggle"></div>
      </div>

      <!-- Smart Door -->
      <div class="card">
        <h2>🚪 Smart Door</h2>
        <div class="status" id="doorStatus">LOCKED</div>
        <div class="toggle" id="doorToggle"></div>
      </div>

      <!-- Smart Car Parking Door -->
      <div class="card">
        <h2>🚗 Parking Door</h2>
        <div class="parking">
          <span class="status" id="parkingStatus">CLOSED</span>
          <div>
            <button onclick="openParking()">Open</button>
            <button class="close" onclick="closeParking()">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Time display (car screen style)
    function updateTime() {
      const now = new Date();
      document.getElementById('time').innerText =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Smart Lamp
    const lampToggle = document.getElementById('lampToggle');
    const lampStatus = document.getElementById('lampStatus');

    lampToggle.addEventListener('click', () => {
      lampToggle.classList.toggle('active');
      lampStatus.innerText = lampToggle.classList.contains('active') ? 'ON' : 'OFF';
    });

    // Smart Door
    const doorToggle = document.getElementById('doorToggle');
    const doorStatus = document.getElementById('doorStatus');

    doorToggle.addEventListener('click', () => {
      doorToggle.classList.toggle('active');
      doorStatus.innerText = doorToggle.classList.contains('active') ? 'UNLOCKED' : 'LOCKED';
    });

    // Parking Door
    const parkingStatus = document.getElementById('parkingStatus');

    function openParking() {
      parkingStatus.innerText = 'OPEN';
    }

    function closeParking() {
      parkingStatus.innerText = 'CLOSED';
    }
  </script>
</body>
</html>
